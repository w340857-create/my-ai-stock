const STORE='myai_receiving_20261115',BAR='myai_receiving_barcodes_20261115',POS='myai_receiving_pos_20261115';
function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}
let saved=load(STORE),barcodes=load(BAR),position=load(POS),groupIndex=Number.isInteger(position.group)?Math.min(Math.max(position.group,0),groups.length-1):1,itemIndex=Number.isInteger(position.item)?position.item:0,filter='all',listMode=false;
function key(gi,ii){return groups[gi].id+':'+ii}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){localStorage.setItem(STORE,JSON.stringify(saved));localStorage.setItem(BAR,JSON.stringify(barcodes));localStorage.setItem(POS,JSON.stringify({group:groupIndex,item:itemIndex}));stats()}function stats(){let done=0,total=0;groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{total++;let v=saved[key(gi,ii)];if(v!==undefined&&v!=='')done++}));document.getElementById('totalProgress').textContent=done+' / '+total;document.getElementById('bar').style.width=(100*done/total)+'%'}

function chooseGroup(v){groupIndex=Number(v);itemIndex=0;listMode=false;persist();render()}function goHome(){listMode=true;render()}function showList(){listMode=!listMode;render()}function setFilter(v){filter=v;listMode=true;render()}function move(d){const n=groups[groupIndex].items.length;itemIndex=Math.max(0,Math.min(n-1,itemIndex+d));listMode=false;persist();render()}function chooseItem(gi,ii){groupIndex=gi;itemIndex=ii;listMode=false;document.getElementById('search').value='';persist();render()}
function setQty(v){const el=document.getElementById('qty');if(el)el.value=Math.max(0,Number(v)||0)}
function mark(mode){const it=groups[groupIndex].items[itemIndex],el=document.getElementById('qty');let v=mode==='ok'?it.n:Number(el?.value);if(!Number.isFinite(v)||v<0){alert('กรุณากรอกจำนวนจริง');return}if(mode==='short'&&v>=it.n){alert('จำนวนขาดต้องน้อยกว่าตามใบ');return}if(mode==='over'&&v<=it.n){alert('จำนวนเกินต้องมากกว่าตามใบ');return}saved[key(groupIndex,itemIndex)]=v;persist();updateItemStatus();}function updateItemStatus(){const it=groups[groupIndex].items[itemIndex],v=saved[key(groupIndex,itemIndex)],q=document.getElementById('qty');if(q)q.value=v;const s=document.getElementById('itemStatus');if(s)s.innerHTML=v===undefined||v===''?'ยังไม่ได้ตรวจ':Number(v)===it.n?'✓ ตรวจครบแล้ว':'⚠ รับจริง '+v+' '+it.u+' · '+(v<it.n?'ขาด ':'เกิน ')+Math.abs(v-it.n)+' '+it.u';}
function setBarcode(v){barcodes[key(groupIndex,itemIndex)]=v.trim();persist();drawBarcode()}function drawBarcode(){const target=document.getElementById('barcodeView');if(!target)return;const code=barcodes[key(groupIndex,itemIndex)]||'';target.innerHTML='';if(!code){target.innerHTML='<div class="muted">ยังไม่มีเลขบาร์โค้ดสินค้าที่ได้รับการยืนยัน</div>';return}if(!/^[0-9]{8,14}$/.test(code)){target.innerHTML='<div class="muted">ใช้เลขบาร์โค้ดจริง 8–14 หลัก</div>';return}if(typeof JsBarcode==='undefined'){target.innerHTML='<div class="muted">โหลดระบบวาดบาร์โค้ดไม่สำเร็จ</div>';return}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');target.appendChild(svg);try{JsBarcode(svg,code,{format:'CODE128',height:67,width:1.8,margin:4,fontSize:16,displayValue:true})}catch(e){target.textContent='รหัสนี้แสดงภาพไม่ได้'}}
function searchNow(){listMode=true;render()}function render(){options();stats();['all','pending','wrong'].forEach(x=>document.getElementById('tab-'+x).className=filter===x?'active':'');const area=document.getElementById('detail'),q=document.getElementById('search').value.toLowerCase();if(listMode||q){let entries=[];groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{const v=saved[key(gi,ii)],done=v!==undefined&&v!=='';if(filter==='pending'&&done||filter==='wrong'&&(!done||Number(v)===it.n))return;if(q&&!(g.id+' '+it.name+' '+(barcodes[key(gi,ii)]||'')).toLowerCase().includes(q))return;if(!q&&gi!==groupIndex)return;entries.push('<button class="list-item" onclick="chooseItem('+gi+','+ii+')"><div><b>'+esc(it.name)+'</b><div><span>'+esc(g.id)+' · ตามใบ '+it.n+' '+it.u+'</span></div></div><span>'+(done?(Number(v)===it.n?'✓ ครบ':'⚠ ไม่ตรง'):'ยังไม่ตรวจ')+'</span></button>')}));area.innerHTML='<div class="panel"><div class="hero"><b>รายการสินค้า</b><span class="badge">'+entries.length+' รายการ</span></div>'+(entries.join('')||'<div class="empty">ไม่พบรายการ</div>')+'</div>';return}
const g=groups[groupIndex],it=g.items[itemIndex]||g.items[0];itemIndex=Math.min(itemIndex,g.items.length-1);const code=barcodes[key(groupIndex,itemIndex)]||'';const v=saved[key(groupIndex,itemIndex)];area.innerHTML='<div class="panel"><div class="hero"><div><div class="label">Tote / กลุ่มสินค้า</div><b>'+esc(g.id)+'</b></div><span class="badge">รายการ '+(itemIndex+1)+' / '+g.items.length+'</span></div><div class="name">'+esc(it.name)+'</div><div class="expected"><div class="muted">จำนวนตามใบรับสินค้า</div><strong>'+it.n+' '+it.u+'</strong></div><div class="label" style="text-align:center">จำนวนที่นับได้จริง</div><div class="qty"><button onclick="setQty(Number(document.getElementById(\'qty\').value)-1)">−</button><input id="qty" type="number" min="0" inputmode="numeric" value="'+(v===undefined?'':esc(v))+'" placeholder="0"><button onclick="setQty(Number(document.getElementById(\'qty\').value)+1)">+</button></div><div class="actions"><button class="ok" onclick="mark(\'ok\')">✓ ครบ</button><button class="short" onclick="mark(\'short\')">− ขาด</button><button class="over" onclick="mark(\'over\')">+ เกิน</button></div><div class="status" id="itemStatus"></div><div class="nav"><button onclick="move(-1)" '+(itemIndex===0?'disabled':'')+'>← ก่อนหน้า</button><button onclick="move(1)" '+(itemIndex===g.items.length-1?'disabled':'')+'>ถัดไป →</button></div></div><div class="panel"><div class="hero"><b>▥ บาร์โค้ดสินค้า</b><span class="badge">'+(code?'มีรหัส':'ยังไม่มีรหัส')+'</span></div><div class="muted" style="margin:8px 0">กรอกเลขจากฉลากจริง ภาพบาร์โค้ดจะขึ้นด้านล่างทันที</div><input class="search" inputmode="numeric" placeholder="เลขบาร์โค้ด 8–14 หลัก" value="'+esc(code)+'" oninput="setBarcode(this.value)"><div class="barcode" id="barcodeView"></div></div>';updateItemStatus();drawBarcode()}
function download(){const payload={date:'2026-11-15',groups,counts:saved,barcodes,exported_at:new Date().toISOString()},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MY_AI_Receiving_Checked_20261115.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}render();
</script></body></html>
